<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gym AI - イヤホン操作検証</title>
  <style>
    :root {
      --bg-color: #121212;
      --panel-bg: #1e1e1e;
      --primary: #4ade80;
      --text-main: #ffffff;
      --text-sub: #a0a0a0;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }
    header {
      background-color: var(--panel-bg);
      padding: 16px;
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      border-bottom: 1px solid #333;
    }
    .display-area {
      padding: 32px 16px;
      text-align: center;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .exercise-name {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 16px;
      color: var(--primary);
    }
    .exercise-details {
      font-size: 1.5rem;
      color: var(--text-sub);
    }
    .controls-area {
      padding: 16px;
      background-color: var(--panel-bg);
      border-top: 1px solid #333;
    }
    button {
      width: 100%;
      padding: 16px;
      margin-bottom: 12px;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      background-color: var(--primary);
      color: #000;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:active {
      opacity: 0.7;
    }
    .manual-controls {
      display: flex;
      gap: 8px;
    }
    .manual-controls button {
      background-color: #333;
      color: #fff;
    }
    .log-area {
      height: 150px;
      background-color: #000;
      overflow-y: auto;
      padding: 12px;
      font-size: 0.85rem;
      font-family: monospace;
      color: #0f0;
      border-top: 1px solid #333;
    }
    .log-entry {
      margin-bottom: 6px;
      border-bottom: 1px dashed #333;
      padding-bottom: 4px;
    }
  </style>
</head>
<body>

  <header>のう筋 (Gym AI) - プロトタイプ</header>

  <!-- iOSでのバックグラウンド再生を確実にするため、DOM上にaudio要素を配置しplaysinlineを付与 -->
 <audio id="bgm" src="./bgm.mp3" loop playsinline preload="auto" style="display:none;"></audio>

  <div class="display-area">
    <div class="exercise-name" id="ui-name">準備中...</div>
    <div class="exercise-details">
      重量: <span id="ui-weight">--</span> kg <br>
      回数: <span id="ui-reps">--</span> Reps
    </div>
  </div>

  <div class="controls-area">
    <button id="btn-start">🎵 BGM開始 & セッション起動</button>
    <div class="manual-controls">
      <button id="btn-prev">⏮ -5kg</button>
      <button id="btn-play">⏯ セット完了</button>
      <button id="btn-next">⏭ +5kg</button>
    </div>
  </div>

  <div class="log-area" id="log-container">
    <div class="log-entry">システム: 待機しています。イヤホン操作前に「開始」を押してください。</div>
  </div>

  <script>
    // トレーニングメニューのモックデータ
    const exercises = [
      { name: "ベンチプレス", weight: 65, reps: 10 },
      { name: "ラットプルダウン", weight: 45, reps: 10 },
      { name: "スクワット", weight: 80, reps: 10 },
      { name: "ショルダープレス", weight: 30, reps: 10 }
    ];
    let currentIndex = 0;
    let currentWeight = exercises[currentIndex].weight;
    let isSessionActive = false;

    const bgm = document.getElementById('bgm');
    const logContainer = document.getElementById('log-container');
    const uiName = document.getElementById('ui-name');
    const uiWeight = document.getElementById('ui-weight');
    const uiReps = document.getElementById('ui-reps');

    // UI更新処理
    function updateUI() {
      const ex = exercises[currentIndex];
      uiName.textContent = ex.name;
      uiWeight.textContent = currentWeight;
      uiReps.textContent = ex.reps;
    }

    // ログ出力処理
    function logEvent(message) {
      const now = new Date();
      const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.textContent = `[${timeStr}] ${message}`;
      logContainer.prepend(entry);
    }

    // 音声読み上げ（TTS）処理
    function speakText(text) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel(); // 連続操作時の重複を防ぐため一度キャンセル
      const msg = new SpeechSynthesisUtterance(text);
      msg.lang = 'ja-JP';
      msg.rate = 1.1; // トレーニング中テンポよく聞けるよう少し早めに
      window.speechSynthesis.speak(msg);
    }

    // 次の種目へ進行（Play/Pause操作時）
    function handleNextSet() {
      currentIndex = (currentIndex + 1) % exercises.length;
      currentWeight = exercises[currentIndex].weight; // 重量リセット
      updateUI();
      logEvent(`⏯ セット完了 ➔ 次は ${exercises[currentIndex].name}`);
      speakText(`${exercises[currentIndex === 0 ? exercises.length - 1 : currentIndex - 1].name}完了。次は${exercises[currentIndex].name}、${currentWeight}キロです。`);
    }

    // 重量変更処理（Next/Prev操作時）
    function handleWeightChange(amount) {
      currentWeight += amount;
      if (currentWeight < 0) currentWeight = 0;
      updateUI();
      const sign = amount > 0 ? 'プラス' : 'マイナス';
      logEvent(`⚖️ 重量調整 ➔ ${currentWeight}kg (${amount > 0 ? '+' : ''}${amount}kg)`);
      speakText(`重量を${sign}${Math.abs(amount)}キロ変更し、${currentWeight}キロに設定しました。`);
    }

    // Media Session APIの設定（iOSコントロールセンターのジャック）
    function setupMediaSession() {
      if ('mediaSession' in navigator) {
        // ロック画面に表示するメタデータ
        navigator.mediaSession.metadata = new MediaMetadata({
          title: 'Gym AI ワークアウト',
          artist: 'のう筋',
          album: 'トレーニングセッション',
          artwork: [
            { src: 'https://via.placeholder.com/512/121212/4ade80?text=GymAI', sizes: '512x512', type: 'image/png' }
          ]
        });

        // 物理ボタン: 再生・停止 (セット完了)
        const playPauseAction = () => {
          handleNextSet();
          // iOSでフォーカスを失わないよう、強制的に再生を継続させる
          bgm.play().catch(e => console.log('BGM Play Error:', e));
        };
        navigator.mediaSession.setActionHandler('play', playPauseAction);
        navigator.mediaSession.setActionHandler('pause', playPauseAction);
        navigator.mediaSession.setActionHandler('stop', playPauseAction);

        // 物理ボタン: 曲送り (重量 +5kg)
        navigator.mediaSession.setActionHandler('nexttrack', () => {
          handleWeightChange(5);
        });

        // 物理ボタン: 曲戻し (重量 -5kg)
        navigator.mediaSession.setActionHandler('previoustrack', () => {
          handleWeightChange(-5);
        });
      }
    }

    // 開始ボタンのイベント
    document.getElementById('btn-start').addEventListener('click', async () => {
      if (isSessionActive) return;

      try {
        setupMediaSession();
        
        // BGM再生
        await bgm.play();
        
        // TTSエンジンのアンロック（iOSSafari必須）
        const unlockMsg = new SpeechSynthesisUtterance('');
        window.speechSynthesis.speak(unlockMsg);

        isSessionActive = true;
        updateUI();
        document.getElementById('btn-start').textContent = '✅ セッション稼働中';
        document.getElementById('btn-start').style.backgroundColor = '#333';
        document.getElementById('btn-start').style.color = '#fff';
        
        logEvent('✅ BGM再生開始＆Media Sessionジャック成功');
        speakText('ワークアウトを開始します。最初の種目は' + exercises[currentIndex].name + 'です。');

     }  catch (err) {
        logEvent(`❌ エラー: ${err.name} - ${err.message}`);
        console.error(err);
     }
    });

    // PC/画面操作用マニュアルボタン
    document.getElementById('btn-play').addEventListener('click', handleNextSet);
    document.getElementById('btn-next').addEventListener('click', () => handleWeightChange(5));
    document.getElementById('btn-prev').addEventListener('click', () => handleWeightChange(-5));

    // 初期化表示
    updateUI();
  </script>
</body>
</html>
