<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>のう筋 - 音声＆音楽 同時検証プロトタイプ</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
    .card { background: #1e1e1e; border-radius: 12px; padding: 20px; margin: 20px 0; }
    button { background: #ff5722; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; margin: 8px; cursor: pointer; }
    .status { color: #00e676; font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>💪 のう筋 音声制御テスト</h1>

  <div class="card">
    <h2 id="exercise">1. ベンチプレス</h2>
    <p id="detail">60 kg × 10 回</p>
  </div>

  <div class="card">
    <button onclick="toggleMusic()">🎵 BGM再生 / 停止</button>
    <button onclick="startVoice()">🎙️ 音声認識スタート</button>
    <div id="status" class="status">マイク停止中</div>
    <p style="font-size: 12px; color: #aaa;">マイクに向かって「次へ」と言ってください</p>
  </div>

  <!-- テスト用BGM（フリー素材音源） -->
  <audio id="bgm" loop src="[suspicious link removed]"></audio>

  <script>
    const exercises = [
      { name: "1. ベンチプレス", detail: "60 kg × 10 回" },
      { name: "2. インクラインダンベルプレス", detail: "22 kg × 10 回" },
      { name: "3. ディップス", detail: "自重 × 15 回" }
    ];
    let currentIndex = 0;

    // BGM再生切り替え
    function toggleMusic() {
      const audio = document.getElementById('bgm');
      if (audio.paused) { audio.play(); } else { audio.pause(); }
    }

    // 音声読み上げ (TTS)
    function speak(text) {
      const uttr = new SpeechSynthesisUtterance(text);
      uttr.lang = 'ja-JP';
      speechSynthesis.speak(uttr);
    }

    // 次の種目へ進む
    function nextExercise() {
      currentIndex = (currentIndex + 1) % exercises.length;
      document.getElementById('exercise').innerText = exercises[currentIndex].name;
      document.getElementById('detail').innerText = exercises[currentIndex].detail;
      speak(`次の種目、${exercises[currentIndex].name}です。`);
    }

    // 音声認識 (Web Speech API)
    function startVoice() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("お使いのブラウザは音声認識に対応していません。Chrome/Safariでお試しください。");
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onstart = () => {
        document.getElementById('status').innerText = "🎙️ 音声認識中... (『次へ』と発声)";
      };

      recognition.onresult = (event) => {
        const last = event.results.length - 1;
        const text = event.results[last].transcript.trim();
        console.log("認識結果:", text);

        if (text.includes("次") || text.includes("つぎ")) {
          nextExercise();
        }
      };

      recognition.onerror = (e) => {
        document.getElementById('status').innerText = "エラー発生: " + e.error;
      };

      recognition.onend = () => {
        recognition.start(); // 自動再開
      };

      recognition.start();
    }
  </script>
</body>
</html>
