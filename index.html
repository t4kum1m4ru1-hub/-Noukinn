<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gym AI - AirPods完全対応版</title>
  <style>
    :root { --bg-color: #121212; --panel-bg: #1e1e1e; --primary: #4ade80; --warning: #f59e0b; --text-main: #ffffff; --text-sub: #a0a0a0; }
    body { margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
    header { background-color: var(--panel-bg); padding: 16px; text-align: center; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #333; }
    .status-badge { display: inline-block; padding: 4px 12px; border-radius: 16px; font-size: 0.9rem; font-weight: bold; margin-top: 8px; }
    .mode-workout { background-color: rgba(74, 222, 128, 0.2); color: var(--primary); }
    .mode-weight { background-color: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid var(--warning); }
    .display-area { padding: 32px 16px; text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .exercise-name { font-size: 2rem; font-weight: 800; margin-bottom: 8px; color: var(--primary); }
    .exercise-details { font-size: 1.5rem; color: var(--text-sub); }
    .weight-highlight { color: var(--warning); font-size: 2rem; font-weight: bold; }
    .controls-area { padding: 16px; background-color: var(--panel-bg); border-top: 1px solid #333; }
    button { width: 100%; padding: 16px; margin-bottom: 8px; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
    #btn-start { background-color: var(--primary); color: #000; margin-bottom: 16px;}
    .manual-controls { display: flex; gap: 8px; margin-bottom: 8px; }
    .manual-controls button { background-color: #333; color: #fff; padding: 12px; font-size: 0.9rem; }
    .log-area { height: 150px; background-color: #000; overflow-y: auto; padding: 12px; font-size: 0.85rem; font-family: monospace; color: #0f0; border-top: 1px solid #333; }
    .log-entry { margin-bottom: 6px; border-bottom: 1px dashed #333; padding-bottom: 4px; }
  </style>
</head>
<body>

  <header>
    Gym AI - AirPods完全対応版<br>
    <span id="ui-mode-badge" class="status-badge mode-workout">🟢 ワークアウト中</span>
  </header>

  <audio id="bgm" src="./bgm.mp3" loop playsinline preload="auto" style="display:none;"></audio>

  <div class="display-area">
    <div class="exercise-name" id="ui-name">準備中...</div>
    <div class="exercise-details">
      重量: <span id="ui-weight">--</span> kg <br>
      回数: <span id="ui-reps">--</span> Reps
    </div>
  </div>

  <div class="controls-area">
    <button id="btn-start">🎵 接続＆開始</button>
    <div class="manual-controls">
      <button id="btn-prev">3回押し (戻る)</button>
      <button id="btn-play">1回押し (完了)</button>
      <button id="btn-next">2回押し (進む)</button>
    </div>
  </div>

  <div class="log-area" id="log-container">
    <div class="log-entry">システム: 待機中。開始を押してください。</div>
  </div>

  <script>
    const exercises = [
      { name: "ベンチプレス", weight: 65, reps: 10 },
      { name: "ラットプルダウン", weight: 45, reps: 10 },
      { name: "スクワット", weight: 80, reps: 10 },
      { name: "ショルダープレス", weight: 30, reps: 10 }
    ];
    let currentIndex = 0;
    let currentWeight = exercises[currentIndex].weight;
    let isSessionActive = false;
    let appMode = 'workout'; 

    const bgm = document.getElementById('bgm');
    const logContainer = document.getElementById('log-container');
    const uiName = document.getElementById('ui-name');
    const uiWeight = document.getElementById('ui-weight');
    const uiReps = document.getElementById('ui-reps');
    const uiModeBadge = document.getElementById('ui-mode-badge');

    // ロック画面メタデータ更新
    function updateMediaMetadata() {
      if (!('mediaSession' in navigator)) return;
      const modeText = appMode === 'workout' ? '🟢 通常モード' : '🔴 重量変更モード';
      navigator.mediaSession.metadata = new MediaMetadata({
        title: `${exercises[currentIndex].name} (${currentWeight}kg)`,
        artist: `Gym AI - ${modeText}`,
        artwork: [{ src: 'https://via.placeholder.com/512/121212/4ade80?text=GymAI', sizes: '512x512', type: 'image/png' }]
      });
    }

    function updateUI() {
      uiName.textContent = exercises[currentIndex].name;
      uiReps.textContent = exercises[currentIndex].reps;
      uiWeight.textContent = currentWeight;

      if (appMode === 'workout') {
        uiModeBadge.textContent = '🟢 ワークアウト中';
        uiModeBadge.className = 'status-badge mode-workout';
        uiWeight.className = '';
      } else {
        uiModeBadge.textContent = '🔴 重量変更モード';
        uiModeBadge.className = 'status-badge mode-weight';
        uiWeight.className = 'weight-highlight';
      }
      updateMediaMetadata();
    }

    function logEvent(message) {
      const timeStr = new Date().toLocaleTimeString('ja-JP');
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.textContent = `[${timeStr}] ${message}`;
      logContainer.prepend(entry);
    }

    function speakText(text) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(text);
      msg.lang = 'ja-JP';
      msg.rate = 1.15;
      window.speechSynthesis.speak(msg);
    }

    // 独立した各アクション関数
    const actionSingleClick = () => {
      if (appMode === 'workout') {
        logEvent(`⏯ [通常] セット完了 (1回押し)`);
        speakText(`セット完了。インターバルを開始します。`);
      } else if (appMode === 'weight') {
        appMode = 'workout';
        exercises[currentIndex].weight = currentWeight;
        updateUI();
        logEvent(`⏯ [重量] 確定 ➔ ${currentWeight}kgで通常モード復帰 (1回押し)`);
        speakText(`重量を${currentWeight}キロに確定しました。`);
      }
    };

    const actionDoubleClick = () => {
      if (appMode === 'workout') {
        appMode = 'weight';
        updateUI();
        logEvent(`⏭ [通常] モード切替 ➔ 重量変更モードへ (2回押し)`);
        speakText('重量変更モード。2回押しでプラス、3回押しでマイナス、1回押しで確定です。');
      } else if (appMode === 'weight') {
        currentWeight += 5;
        updateUI();
        logEvent(`⏭ [重量] +5kg ➔ ${currentWeight}kg (2回押し)`);
        speakText(`${currentWeight}キロ`);
      }
    };

    const actionTripleClick = () => {
      if (appMode === 'workout') {
        currentIndex = (currentIndex + 1) % exercises.length;
        currentWeight = exercises[currentIndex].weight;
        updateUI();
        logEvent(`⏮ [通常] 種目変更 ➔ ${exercises[currentIndex].name} (3回押し)`);
        speakText(`種目を変更します。次は${exercises[currentIndex].name}、${currentWeight}キロです。`);
      } else if (appMode === 'weight') {
        currentWeight = Math.max(0, currentWeight - 5);
        updateUI();
        logEvent(`⏮ [重量] -5kg ➔ ${currentWeight}kg (3回押し)`);
        speakText(`${currentWeight}キロ`);
      }
    };


    // ==========================================
    // 💡 究極のハック：クリック回数判定ロジック
    // ==========================================
    let clickCount = 0;
    let clickTimer = null;
    const CLICK_DELAY = 600; // 0.6秒間に入力された回数を判定

    const handleHardwareClick = () => {
      // 常に再生を維持し、iOSに止めさせない
      bgm.play().catch(e => console.log(e));

      clickCount++;
      if (clickTimer) clearTimeout(clickTimer);

      // 0.6秒後に最終的なクリック回数を見てアクションを決定
      clickTimer = setTimeout(() => {
        if (clickCount === 1) {
          actionSingleClick();
        } else if (clickCount === 2) {
          actionDoubleClick();
        } else if (clickCount >= 3) {
          actionTripleClick();
        }
        clickCount = 0; // カウントリセット
      }, CLICK_DELAY);
    };

    function setupMediaSession() {
      if (!('mediaSession' in navigator)) return;
      // 再生/停止 の「どちらのイベントが来ても」回数判定に流し込む
      navigator.mediaSession.setActionHandler('play', handleHardwareClick);
      navigator.mediaSession.setActionHandler('pause', handleHardwareClick);
      
      // コントロールセンターから押された時用に一応残しておく
      navigator.mediaSession.setActionHandler('nexttrack', actionDoubleClick);
      navigator.mediaSession.setActionHandler('previoustrack', actionTripleClick);
    }

    // デバッグ用
    document.getElementById('btn-play').addEventListener('click', actionSingleClick);
    document.getElementById('btn-next').addEventListener('click', actionDoubleClick);
    document.getElementById('btn-prev').addEventListener('click', actionTripleClick);

    document.getElementById('btn-start').addEventListener('click', async () => {
      if (isSessionActive) return;
      try {
        await bgm.play();
        setupMediaSession();
        
        const unlockMsg = new SpeechSynthesisUtterance('');
        window.speechSynthesis.speak(unlockMsg);

        isSessionActive = true;
        updateUI();
        
        const btn = document.getElementById('btn-start');
        btn.textContent = '✅ セッション稼働中';
        btn.style.backgroundColor = '#333';
        btn.style.color = '#fff';
        
        logEvent('✅ 起動完了。AirPodsの操作をテストしてください。');
        speakText('ワークアウトを開始します。最初の種目は' + exercises[currentIndex].name + 'です。');
      } catch (err) {
        logEvent(`❌ エラー: ${err.name} - ${err.message}`);
      }
    });

    updateUI();
  </script>
</body>
</html>
