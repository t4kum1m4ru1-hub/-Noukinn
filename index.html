<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>のう筋 (Gym AI) - プロトタイプ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        /* スクロールバーのカスタマイズ（ログエリア用） */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1f2937; 
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #4b5563; 
            border-radius: 4px;
        }
        .glass-panel {
            background: rgba(31, 41, 55, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- ヘッダー -->
    <header class="pt-10 pb-4 px-6 text-center">
        <h1 class="text-xl font-bold tracking-wider text-gray-300">のう筋 <span class="text-blue-500">Gym AI</span></h1>
        <p class="text-xs text-gray-500 mt-1">Bluetooth Earphone & TTS Verification</p>
    </header>

    <!-- メインコンテンツ (トレーニングステータス) -->
    <main class="flex-1 flex flex-col items-center justify-center px-6">
        
        <div id="start-overlay" class="absolute inset-0 z-50 flex items-center justify-center bg-[#121212] bg-opacity-90">
            <button id="start-session-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-8 rounded-full shadow-lg shadow-blue-500/30 transition transform hover:scale-105 active:scale-95 text-lg">
                🎵 BGM開始 & セッション起動
            </button>
        </div>

        <div class="glass-panel w-full max-w-sm rounded-3xl p-8 text-center shadow-2xl relative overflow-hidden">
            <!-- 背景装飾 -->
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
            
            <p class="text-sm text-gray-400 font-medium mb-1">現在の種目</p>
            <h2 id="workout-name" class="text-3xl font-extrabold mb-6">ベンチプレス</h2>
            
            <div class="flex justify-center items-end space-x-2 mb-2">
                <span id="workout-weight" class="text-7xl font-black text-blue-400">60</span>
                <span class="text-xl text-gray-400 font-bold mb-2">kg</span>
            </div>
            
            <div class="mt-4 inline-block bg-gray-800 rounded-full px-4 py-1">
                <span class="text-gray-300 text-sm font-semibold">目標: <span id="workout-reps" class="text-white text-base">10</span> Reps</span>
            </div>
        </div>

        <!-- マニュアル操作ボタン (PC検証用) -->
        <div class="mt-8 w-full max-w-sm">
            <p class="text-xs text-gray-500 text-center mb-3">PC・画面確認用エミュレートボタン</p>
            <div class="flex justify-between space-x-3">
                <button onclick="emulateAction('previoustrack')" class="flex-1 bg-gray-800 hover:bg-gray-700 py-3 rounded-xl text-sm font-medium transition active:scale-95 border border-gray-700">
                    ⏮️ -5kg
                </button>
                <button onclick="emulateAction('play')" class="flex-1 bg-blue-600 hover:bg-blue-500 py-3 rounded-xl text-sm font-bold shadow-lg shadow-blue-500/20 transition active:scale-95 text-white">
                    ▶️ / ⏸️ 完了
                </button>
                <button onclick="emulateAction('nexttrack')" class="flex-1 bg-gray-800 hover:bg-gray-700 py-3 rounded-xl text-sm font-medium transition active:scale-95 border border-gray-700">
                    ⏭️ +5kg
                </button>
            </div>
        </div>
    </main>

    <!-- ログ表示エリア -->
    <div class="h-1/3 bg-gray-900 border-t border-gray-800 p-4 flex flex-col">
        <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">操作ログ (Media Session API)</h3>
        <div id="log-container" class="flex-1 overflow-y-auto custom-scrollbar space-y-2 pr-2">
            <!-- ログがここに追加されます -->
        </div>
    </div>

    <!-- 音声再生用オーディオ (無音) -->
    <!-- Base64エンコードされた短い無音WAVファイル -->
    <audio id="bgm-audio" loop>
        <source src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==" type="audio/wav">
    </audio>

    <script>
        // --- 状態管理 ---
        const workouts = [
            { name: 'ベンチプレス', weight: 60, reps: 10 },
            { name: 'ラットプルダウン', weight: 50, reps: 10 },
            { name: 'スクワット', weight: 80, reps: 10 },
            { name: 'デッドリフト', weight: 100, reps: 8 }
        ];
        
        let currentWorkoutIndex = 0;
        let currentWeight = workouts[currentWorkoutIndex].weight;
        let lastActionTime = 0; // デバウンス用

        // --- DOM Elements ---
        const uiName = document.getElementById('workout-name');
        const uiWeight = document.getElementById('workout-weight');
        const uiReps = document.getElementById('workout-reps');
        const logContainer = document.getElementById('log-container');
        const bgmAudio = document.getElementById('bgm-audio');
        const startBtn = document.getElementById('start-session-btn');
        const startOverlay = document.getElementById('start-overlay');

        // --- UI初期化 ---
        function updateUI() {
            uiName.textContent = workouts[currentWorkoutIndex].name;
            uiWeight.textContent = currentWeight;
            uiReps.textContent = workouts[currentWorkoutIndex].reps;
        }
        updateUI();

        // --- ログ出力 ---
        function addLog(message, type = 'info') {
            const time = new Date().toLocaleTimeString('ja-JP', { hour12: false });
            const logItem = document.createElement('div');
            
            let colorClass = 'text-gray-300';
            if (type === 'action') colorClass = 'text-blue-400 font-semibold';
            if (type === 'voice') colorClass = 'text-green-400';
            if (type === 'error') colorClass = 'text-red-400';

            logItem.className = `text-sm pb-2 border-b border-gray-800 ${colorClass}`;
            logItem.innerHTML = `<span class="text-xs text-gray-500 mr-2">[${time}]</span> ${message}`;
            
            logContainer.prepend(logItem); // 新しいものを一番上に
        }

        // --- TTS (音声合成) ---
        function speak(text) {
            if ('speechSynthesis' in window) {
                // 現在の読み上げをキャンセルして即座に次の発話へ
                window.speechSynthesis.cancel(); 
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';
                utterance.rate = 1.15; // トレーニング中は少し早めが聞きやすい
                utterance.pitch = 1.0;
                
                window.speechSynthesis.speak(utterance);
                addLog(`🗣️ TTS: "${text}"`, 'voice');
            } else {
                addLog('⚠️ ブラウザが音声合成をサポートしていません', 'error');
            }
        }

        // --- アクションロジック ---
        // イヤホンのPlay/PauseはOSによって連続で発火することがあるためデバウンス処理を入れる
        function debounce(func, delay = 800) {
            return function() {
                const now = Date.now();
                if (now - lastActionTime > delay) {
                    func();
                    lastActionTime = now;
                } else {
                    addLog('連続入力をスキップしました', 'info');
                }
            };
        }

        const handleCompleteSet = debounce(() => {
            currentWorkoutIndex++;
            if (currentWorkoutIndex >= workouts.length) {
                speak('すべてのトレーニングメニューが完了しました。お疲れ様でした。');
                currentWorkoutIndex = 0; // プロトタイプ用ループ
                currentWeight = workouts[currentWorkoutIndex].weight;
            } else {
                const next = workouts[currentWorkoutIndex];
                currentWeight = next.weight;
                speak(`${workouts[currentWorkoutIndex - 1].name}完了。次は${next.name}、${currentWeight}キロ、${next.reps}回です。`);
            }
            updateUI();
            updateMediaMetadata(); // ロック画面の表示を更新
        });

        const handleIncreaseWeight = debounce(() => {
            currentWeight += 5;
            speak(`重量を${currentWeight}キロに変更しました。`);
            updateUI();
        });

        const handleDecreaseWeight = debounce(() => {
            currentWeight -= 5;
            if (currentWeight < 0) currentWeight = 0;
            speak(`重量を${currentWeight}キロに変更しました。`);
            updateUI();
        });

        // --- Media Session API ---
        function updateMediaMetadata() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: `🔴 ${workouts[currentWorkoutIndex].name} - ${currentWeight}kg`,
                    artist: 'のう筋 Gym AI',
                    album: 'トレーニングセッション',
                    artwork: [
                        { src: 'https://placehold.co/512x512/1d4ed8/ffffff?text=Gym+AI', sizes: '512x512', type: 'image/png' }
                    ]
                });
            }
        }

        function setupMediaSession() {
            if ('mediaSession' in navigator) {
                updateMediaMetadata();

                // イヤホンの各種ボタンイベントをフック
                navigator.mediaSession.setActionHandler('play', () => {
                    addLog('🎧 物理ボタン検知: Play (セット完了)', 'action');
                    handleCompleteSet();
                    bgmAudio.play(); // 再生状態を維持
                });
                
                navigator.mediaSession.setActionHandler('pause', () => {
                    addLog('🎧 物理ボタン検知: Pause (セット完了)', 'action');
                    handleCompleteSet();
                    bgmAudio.play(); // 停止させずに再生状態を維持（フックし続けるため）
                });
                
                navigator.mediaSession.setActionHandler('nexttrack', () => {
                    addLog('🎧 物理ボタン検知: Next Track (+5kg)', 'action');
                    handleIncreaseWeight();
                });
                
                navigator.mediaSession.setActionHandler('previoustrack', () => {
                    addLog('🎧 物理ボタン検知: Prev Track (-5kg)', 'action');
                    handleDecreaseWeight();
                });
                
                navigator.mediaSession.setActionHandler('stop', () => {
                    addLog('🎧 物理ボタン検知: Stop (セット完了)', 'action');
                    handleCompleteSet();
                });

                addLog('✅ Media Session API が有効になりました');
            } else {
                addLog('⚠️ このブラウザはMedia Session APIをサポートしていません', 'error');
            }
        }

        // --- 初期化イベント ---
        startBtn.addEventListener('click', async () => {
            try {
                // ユーザーインタラクション起因でAudioとTTSのコンテキストを初期化
                await bgmAudio.play();
                startOverlay.style.display = 'none';
                setupMediaSession();
                
                // 初回の読み上げ
                speak(`トレーニングを開始します。最初の種目は${workouts[currentWorkoutIndex].name}、${currentWeight}キロです。`);
            } catch (error) {
                // 再生がブロックされた場合でもUIは進めて、手動テストができるようにする
                startOverlay.style.display = 'none';
                setupMediaSession();
                addLog(`BGM再生ブロック: ${error.message}`, 'error');
                speak(`トレーニングを開始します。最初の種目は${workouts[currentWorkoutIndex].name}、${currentWeight}キロです。`);
            }
        });

        // 画面上のボタンからのエミュレート用関数
        function emulateAction(action) {
            if (action === 'play') {
                addLog('👆 画面ボタン: 完了', 'action');
                handleCompleteSet();
            } else if (action === 'nexttrack') {
                addLog('👆 画面ボタン: +5kg', 'action');
                handleIncreaseWeight();
            } else if (action === 'previoustrack') {
                addLog('👆 画面ボタン: -5kg', 'action');
                handleDecreaseWeight();
            }
        }

    </script>
</body>
</html>
